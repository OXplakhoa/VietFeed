; Dedicated php-fpm pool for the VietFeed demo (PHP 8.4).
; Install: sudo cp deploy/php-fpm/vietfeed-demo.conf /etc/php/8.4/fpm/pool.d/vietfeed-demo.conf
;          sudo cp deploy/php-fpm/99-vietfeed-demo.ini /etc/php/8.4/fpm/conf.d/99-vietfeed-demo.ini
;          sudo systemctl restart php8.4-fpm
; The stock "www" pool may be left alone (it listens on its own socket) or disabled.
[vietfeed-demo]
user = dolakhoa
group = dolakhoa

; Caddy runs as user "caddy": it must be able to open the socket.
listen = /run/php/vietfeed-demo.sock
listen.owner = dolakhoa
listen.group = caddy
listen.mode = 0660

; Home PC next to four Docker stores: keep the footprint small.
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
pm.process_idle_timeout = 30s
request_terminate_timeout = 60s

catch_workers_output = yes
security.limit_extensions = .php
clear_env = yes

; Per-pool (admin values cannot be overridden by the app).
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 60
php_admin_value[upload_max_filesize] = 10M
php_admin_value[post_max_size] = 12M
php_admin_value[expose_php] = Off
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /home/dolakhoa/vietfeed-demo/storage/logs/php-fpm-error.log
php_admin_value[realpath_cache_size] = 4096K
php_admin_value[realpath_cache_ttl] = 600
; Code only changes on deploy, and deploy ends with `sudo systemctl reload php8.4-fpm`.
php_admin_flag[opcache.validate_timestamps] = off
