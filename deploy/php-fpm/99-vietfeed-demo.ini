; FPM-only production overrides (the CLI used by artisan/queue keeps its own php.ini).
; Install to /etc/php/8.4/fpm/conf.d/99-vietfeed-demo.ini. OPcache memory settings are master-level, so they
; live here rather than in the pool file.
opcache.enable=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.save_comments=1
opcache.jit=off
expose_php=Off
display_errors=Off
